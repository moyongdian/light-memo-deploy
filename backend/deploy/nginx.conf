server {
    listen 80;
    server_name memo-api.example.com;
    return 301 https://memo-api.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name memo-api.example.com;
    ssl_certificate /etc/letsencrypt/live/memo-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memo-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Do not log private search terms.
    access_log off;
    client_max_body_size 256k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }
}
