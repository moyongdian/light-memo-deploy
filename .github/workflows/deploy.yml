name: Build & Deploy (Docker)

# 触发时机：推送到 main 分支，或手动点 "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署在跑，避免两台机器抢着更新服务器
concurrency:
  group: deploy-docker
  cancel-in-progress: false

jobs:
  # ============ Job 1：构建镜像并推送到 GHCR ============
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 必须有，否则推不进 GHCR
    outputs:
      image-base: ${{ steps.vars.outputs.image-base }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名和标签
        id: vars
        run: |
          # GHCR 要求镜像名全小写，仓库名可能有大写字母，这里统一转小写
          echo "image-base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 开启 BuildKit 缓存
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Actions 自动发放，不用自己配

      # 后端镜像
      - name: 构建并推送 memo-api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image-base }}/memo-api:latest
            ${{ steps.vars.outputs.image-base }}/memo-api:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=memo-api
          cache-to: type=gha,mode=max,scope=memo-api

      # 前端镜像（需要 SITE_URL 变量，在仓库 Settings → Variables 里配置）
      - name: 构建并推送 memo-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.SITE_URL }}
          tags: |
            ${{ steps.vars.outputs.image-base }}/memo-web:latest
            ${{ steps.vars.outputs.image-base }}/memo-web:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=memo-web
          cache-to: type=gha,mode=max,scope=memo-web

  # ============ Job 2：SSH 到服务器拉镜像重启 ============
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 仓库变量 DEPLOY_ENABLED=true 才会真正部署。
    # 这样在服务器还没准备好时，可以先推代码让 CI 只构建镜像不部署。
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # 把编排文件同步到服务器。
      # 注意：override 文件必须先于 compose 文件到位，否则 compose 会以为服务缺少 443 配置。
      - name: 同步 docker-compose.yml、override 与 nginx 配置
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml,deploy/nginx/,deploy/docker-compose.override.yml,deploy/server-deploy.sh"
          target: ${{ secrets.SERVER_DIR }}
          # 保留仓库里的目录结构，避免文件散落到根目录
          strip_components: 0
          overwrite: true

      - name: 把 override 与部署脚本放到正确位置
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_DIR: ${{ secrets.SERVER_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: SERVER_DIR
          script: |
            set -e
            cd "$SERVER_DIR"
            # scp-action 会把 deploy/ 整个目录传上来，这里把 override 移到位
            if [ -f deploy/docker-compose.override.yml ]; then
              cp deploy/docker-compose.override.yml ./docker-compose.override.yml
            fi
            # 部署脚本统一放到 /srv/light-memo/deploy.sh
            if [ -f deploy/server-deploy.sh ]; then
              install -m 755 deploy/server-deploy.sh /srv/light-memo/deploy.sh
            fi
            echo "==> 文件就位"
            ls -la docker-compose.yml docker-compose.override.yml 2>/dev/null || true

      - name: 拉取新镜像并重启服务
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_BASE: ${{ needs.build.outputs.image-base }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: IMAGE_BASE,TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 10m
          script: |
            # 交给服务器上的部署脚本执行；set -e 让任一步失败都中断
            set -e
            export IMAGE_BASE TAG GHCR_USER GHCR_TOKEN
            bash /srv/light-memo/deploy.sh
