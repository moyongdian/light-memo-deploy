# 安全响应头片段：被各个 location 用 include 引入。
#
# 为什么单独放一个文件？
# Nginx 的 add_header 有个经典陷阱：
# 子级 location 里一旦出现 add_header，就会【完全覆盖】上层继承的所有 add_header。
# 所以凡是自己要加响应头的 location，都要重新 include 一遍。
#
# 这些头等价于项目里 frontend/config/headers.template（那是给 EdgeOne/Cloudflare Pages 用的，
# Nginx 不认识 _headers 文件，所以在这里手动实现一遍）。

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;

# CSP：因为前后端同源部署（Nginx 把 /api 反代到后端），connect-src 用 'self' 就够了。
# antd 的样式用了内联 style，所以 style-src 需要 'unsafe-inline'。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
