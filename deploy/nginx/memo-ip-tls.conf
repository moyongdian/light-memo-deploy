# light-memo 站点配置：IP 直接访问 + 自签证书 HTTPS
#
# 适用场景：
#   - 服务器在中国大陆，域名未备案 → 云厂商会拦截基于域名的访问（返回 webblock 页面），
#     Let's Encrypt 的 HTTP-01 校验也会失败，只能用自签证书
#   - 没有域名，直接用 https://<公网IP> 访问
#
# ⚠️ 自签证书的代价：浏览器会提示"不安全"，需要手动点「高级 → 继续访问」。
#    首次接受后，本机会在本次会话内信任该证书，登录和 API 都能正常工作。
#    有备案域名后请换成 Let's Encrypt 正式证书（见 docs/DEPLOY-DOCKER.md 第 7 步）。
#
# 证书生成命令（在服务器上执行）：
#   mkdir -p /srv/light-memo/certs
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout /srv/light-memo/certs/privkey.pem \
#     -out   /srv/light-memo/certs/fullchain.pem \
#     -days 365 -subj "/CN=111.230.141.73" \
#     -addext "subjectAltName=IP:111.230.141.73"

resolver 127.0.0.11 valid=30s ipv6=off;

# HTTP 全部跳 HTTPS：登录 Cookie 是 Secure，必须走 HTTPS 才能保住登录态
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    include /etc/nginx/memo/security-headers.conf;

    location = /healthz {
        set $api_upstream "http://api:8080";
        proxy_pass $api_upstream$request_uri;
        include /etc/nginx/memo/proxy-params.conf;
    }

    location /api/ {
        set $api_upstream "http://api:8080";
        proxy_pass $api_upstream$request_uri;
        include /etc/nginx/memo/proxy-params.conf;
    }

    location /assets/ {
        include /etc/nginx/memo/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/memo/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
