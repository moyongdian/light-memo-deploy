# light-memo 站点配置（HTTP 版，先用 IP 跑通用）
#
# 职责分工：
#   /            → 前端静态文件（SPA，含路由回退）
#   /api/        → 反代到 Go 后端容器
#   /healthz     → 反代健康检查
#
# 关键设计：前后端【同源】。前端请求 /api/v1/... 打到自己的域名，
# 由 Nginx 转发给后端。好处是：没有跨域问题、Cookie 的 SameSite=Strict 能正常工作。

# Docker 内嵌 DNS 的地址。配合下面用变量写 proxy_pass，
# 可以让后端容器重启换 IP 后 Nginx 自动重新解析，
# 避免经典的 "host not found in upstream" / 连到旧 IP 的问题。
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;          # 先用 IP 访问；有域名后改成你的域名，多个用空格分隔

    root /usr/share/nginx/html;
    index index.html;

    # 与后端一致的请求体上限（后端也有 256KB 限制）
    client_max_body_size 256k;
    server_tokens off;      # 不暴露 Nginx 版本号

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    include /etc/nginx/memo/security-headers.conf;

    # ---------- 1. 健康检查 ----------
    location = /healthz {
        set $api_upstream "http://api:8080";
        proxy_pass $api_upstream$request_uri;
        include /etc/nginx/memo/proxy-params.conf;
    }

    # ---------- 2. 后端 API ----------
    location /api/ {
        set $api_upstream "http://api:8080";
        proxy_pass $api_upstream$request_uri;
        include /etc/nginx/memo/proxy-params.conf;
    }

    # ---------- 3. 带 hash 的静态资源：一年强缓存 ----------
    location /assets/ {
        include /etc/nginx/memo/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------- 4. SPA 入口与其它路径：不缓存，路由回退到 index.html ----------
    location / {
        include /etc/nginx/memo/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # $uri 找不到文件/目录时，交给前端路由处理（/login /settings /templates 等）
        try_files $uri $uri/ /index.html;
    }
}
